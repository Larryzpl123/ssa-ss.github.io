<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSA Smart Schedule</title>
<style>
  :root{
    --bg:#0d0f14; --panel:#151922; --panel2:#1c2230; --line:#2a3142;
    --ink:#e7ecf3; --ink-dim:#8b95a7; --accent:#ffd23f; --today:#ffffff;
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 600px at 85% -10%, #1a2335 0%, transparent 60%), var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;min-height:100%;
  }
  header{
    display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;
    padding:1.1rem 1.4rem .9rem;border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,rgba(13,15,20,.97),rgba(13,15,20,.82));
    backdrop-filter:blur(8px);
  }
  .brand h1{font-size:1.15rem;letter-spacing:.06em;font-weight:600}
  .brand .sub{color:var(--ink-dim);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;margin-top:.2rem}
  .clock{text-align:right;font-variant-numeric:tabular-nums}
  .clock .c-date{font-size:.78rem;color:var(--ink-dim);letter-spacing:.04em}
  .clock .c-time{font-size:1.45rem;font-weight:600;color:var(--accent);letter-spacing:.04em}

  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;padding:.8rem 1.4rem;border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;gap:.5rem}
  button,select,input{font-family:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:.45rem .7rem;font-size:.8rem;cursor:pointer;transition:.15s}
  button:hover,select:hover{border-color:var(--accent);color:var(--accent)}
  .arrow{font-size:1rem;width:2.4rem;height:2.2rem;display:grid;place-items:center}
  .wklabel{min-width:14rem;text-align:center;color:var(--ink-dim);font-size:.82rem}
  .spacer{flex:1}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-radius:0;background:var(--panel)}
  .seg button.on{background:var(--accent);color:#0d0f14;font-weight:600}

  main{padding:1.1rem 1.4rem 3rem}
  .grid-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .ghead{display:grid;grid-template-columns:64px repeat(5,1fr)}
  .ghead .corner{border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
  .dcell{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:.55rem .5rem;text-align:center}
  .dcell:last-child{border-right:0}
  .dcell .dow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
  .dcell .dnum{font-size:.98rem;font-weight:600;margin-top:.1rem}
  .dcell .dcyc{font-size:.68rem;color:var(--ink-dim);margin-top:.05rem}
  .dcell .dname{font-size:.66rem;color:var(--accent);margin-top:.15rem;min-height:.8rem}
  .dcell.today{box-shadow:inset 0 0 0 2px var(--today)}

  .gbody{display:grid;grid-template-columns:64px repeat(5,1fr);position:relative}
  .axis{position:relative;border-right:1px solid var(--line)}
  .axis .tick{position:absolute;left:0;right:0;border-top:1px dashed var(--line);font-size:.62rem;color:var(--ink-dim);padding:.05rem .2rem}
  .col{position:relative;border-right:1px solid var(--line)}
  .col:last-child{border-right:0}
  .col.today{background:rgba(255,255,255,.025)}
  .hline{position:absolute;left:0;right:0;border-top:1px dashed rgba(255,255,255,.05)}

  .block{position:absolute;left:4px;right:4px;border-radius:8px;padding:.35rem .45rem;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:var(--blk,#222);color:#0c0c0c;font-size:.66rem;line-height:1.18;transition:.15s;cursor:pointer}
  .block .bextra{max-height:0;opacity:0;overflow:hidden;transition:opacity .25s ease,max-height .25s ease}
  .block:not(.dayfull):hover{height:auto!important;min-height:96px;z-index:8;box-shadow:0 6px 18px rgba(0,0,0,.5);filter:brightness(1.06);border-color:rgba(255,255,255,.4)}
  .block:not(.dayfull):hover .bextra{max-height:200px;opacity:1}
  .block.dayfull{cursor:default}
  .block.now{box-shadow:0 0 0 2px var(--accent),0 4px 14px rgba(0,0,0,.4);z-index:6}
  .block .bname{font-weight:700;font-size:.72rem}
  .block .bnum{opacity:.85}
  .block .bper{font-weight:600;margin-top:.1rem}
  .block .bteach{opacity:.8;margin-top:.05rem}
  .block .btime{opacity:.9;margin-top:.1rem;font-variant-numeric:tabular-nums}
  .block.fixed{background:repeating-linear-gradient(45deg,#3a4252,#3a4252 6px,#333b49 6px,#333b49 12px);color:#cfd6e2;border-style:dashed}
  .block.fixed .bname{font-size:.66rem}

  .nowbar{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--accent);z-index:7}
  .nowbar::before{content:"";position:absolute;left:-3px;top:-4px;width:7px;height:7px;border-radius:50%;background:var(--accent)}

  .legend{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1rem;font-size:.7rem;color:var(--ink-dim);align-items:center}
  .legend .li{display:flex;align-items:center;gap:.35rem}
  .sw{width:14px;height:14px;border-radius:4px;border:1px solid rgba(255,255,255,.2)}

  dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:1.2rem;max-width:340px}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  dialog h3{margin-bottom:.8rem;font-size:.95rem}
  dialog .row{display:flex;gap:.5rem;margin-bottom:.6rem;align-items:center}
  dialog label{font-size:.75rem;color:var(--ink-dim);min-width:3.4rem}
  .status{font-size:.7rem;color:var(--ink-dim);padding:.4rem 1.4rem 0}
  @media (max-width:640px){.clock .c-time{font-size:1.1rem}.wklabel{min-width:auto;font-size:.7rem}.block{font-size:.58rem}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>SSA Smart Schedule</h1>
    <div class="sub">Shady Side Academy · Senior School</div>
  </div>
  <div class="clock">
    <div class="c-date" id="cDate">—</div>
    <div class="c-time" id="cTime">—</div>
  </div>
</header>

<div class="toolbar">
  <div class="nav">
    <button class="arrow" id="prevWk" title="Previous week">‹</button>
    <div class="wklabel" id="wkLabel">—</div>
    <button class="arrow" id="nextWk" title="Next week">›</button>
  </div>
  <button id="todayBtn">Today</button>
  <button id="pickBtn">Pick date ▾</button>
  <select id="yearSel" title="School year"></select>
  <div style="position:relative">
    <input id="stuSearch" placeholder="Search student (ssa username, start of email)" autocomplete="off" style="width:24rem">
    <div id="stuResults" style="position:absolute;top:110%;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;max-height:240px;overflow:auto;z-index:30;display:none"></div>
  </div>
  <div class="spacer"></div>
  <div class="seg" id="fmtSeg">
    <button data-f="12h" class="on">12h</button>
    <button data-f="24h">24h</button>
  </div>
</div>
<div class="status" id="status"></div>

<main>
  <div class="grid-wrap">
    <div class="ghead" id="ghead"></div>
    <div class="gbody" id="gbody"></div>
  </div>
  <div class="legend" id="legend"></div>
</main>

<dialog id="dateDlg">
  <h3>Jump to date</h3>
  <div class="row"><label>Year</label><select id="dlgY"></select></div>
  <div class="row"><label>Month</label><select id="dlgM"></select></div>
  <div class="row"><label>Day</label><select id="dlgD"></select></div>
  <div class="row" style="justify-content:flex-end">
    <button id="dlgCancel">Cancel</button>
    <button id="dlgGo" style="border-color:var(--accent);color:var(--accent)">Go</button>
  </div>
</dialog>

function parseStudentIndex(txt){
  return txt.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!l.startsWith("#")).map(l=>{

/* ---- helpers ---- */
const pad=n=>String(n).padStart(2,"0");
const toMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m;};
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function fmtTime(min,is12){let h=Math.floor(min/60),m=min%60;if(is12){const ap=h>=12?"PM":"AM";let hh=h%12;if(hh===0)hh=12;return `${hh}:${pad(m)} ${ap}`;}return `${pad(h)}:${pad(m)}`;}

/* ---- parsing ---- */
function parseCalendar(txt,startYear){
  const ymd=mmdd=>{const[mm,dd]=mmdd.split(".").map(Number);const y=mm>=8?startYear:startYear+1;return new Date(y,mm-1,dd);};
  const blocks=[],anchors=[];
  txt.split(/\r?\n/).forEach(line=>{
    line=line.trim(); if(!line||line.startsWith("#"))return;
    let m=line.match(/^@anchor\s+(\d{4})-(\d{2})-(\d{2})\s*=\s*(\d)/);
    if(m){anchors.push({date:new Date(+m[1],+m[2]-1,+m[3]),cycle:+m[4]});return;}
    m=line.match(/^(\d{2}\.\d{2})-(\d{2}\.\d{2})(?:\s+"([^"]*)")?(?:\s+(\S+))?/);
    if(!m)return;
    blocks.push({start:ymd(m[1]),end:ymd(m[2]),name:m[3]||null,type:m[4]||null});
  });
  return {blocks,anchors};
}

function parseStudent(txt){
  const s={name:"",form:"",classes:{},latearly:{},days:{},fixed:[],imm:null,immBlocks:[],sports:[],pref:{},terms:[]};
  let idx=0, curTerm=null;
  const ensureTerm=()=>{ if(!curTerm){curTerm={label:"All Year",from:null,to:null,classes:{},imm:null,sports:[]};s.terms.push(curTerm);} return curTerm; };
  for(const raw of txt.split(/\r?\n/)){
    const line=raw.trim();
    if(!line||line.startsWith("#")) continue;
    if(line.startsWith("@finals")){const m=line.match(/^@finals\s+(\d{2}\.\d{2})\s*\|\s*([^|]+?)\s*\|\s*(.*?)\s*-\s*(\d{1,2}:\d{2})-(\d{1,2}:\d{2})/);if(m){s.finals=s.finals||{};(s.finals[m[1]]=s.finals[m[1]]||[]).push({grades:m[2].trim(),label:m[3].trim(),start:m[4],end:m[5]});}continue;}
    if(line.startsWith("@term")){const m=line.match(/^@term\s+(.*?)\s*=\s*(\d{2}\.\d{2})-(\d{2}\.\d{2})/);if(m){curTerm={label:m[1],from:m[2],to:m[3],classes:{},imm:null,sports:[]};s.terms.push(curTerm);}continue;}
    if(line.startsWith("@immersive")){const p=line.replace("@immersive","").trim().split(" - ").map(x=>x.trim());const im={name:p[0],num:p[1],teacher:p[2],room:p[3],color:p[4]||"indigo"};if(s.terms.length){ensureTerm().imm=im;}else s.imm=im;continue;}
    if(line.startsWith("@imm_block")){const p=line.replace("@imm_block","").trim().split(" - ").map(x=>x.trim());const r=(p[1]||"").split("-");if(r.length===2)s.immBlocks.push({label:p[0],start:r[0],end:r[1]});continue;}
    if(line.startsWith("@imm_community")){const m=line.match(/^@imm_community\s+(\w+)\s*=\s*(.*)$/);if(m){s.immComm=s.immComm||{};if(m[1]==="time"){const r=m[2].split("-");s.immComm.time={start:r[0],end:r[1]};}else s.immComm[m[1]]=m[2].trim();}continue;}
    if(line.startsWith("@community")){const m=line.match(/^@community\s+(\w+)\s*=\s*(.*)$/);if(m){s.comm=s.comm||{};if(m[1]==="time"){const r=m[2].split("-");s.comm.time={start:r[0],end:r[1]};}else s.comm[m[1]]=m[2].trim();}continue;}
    if(line.startsWith("@wed")){const m=line.match(/^@wed\s+(\d{1,2}:\d{2})\s*=>\s*(\d{1,2}:\d{2})-(\d{1,2}:\d{2})/);if(m){s.wed=s.wed||{};s.wed[m[1]]={start:m[2],end:m[3]};}continue;}
    if(line.startsWith("@dismiss")){const m=line.match(/^@dismiss\s+(\w+)\s*=\s*(\S+)/);if(m){s.dismiss=s.dismiss||{};s.dismiss[m[1]]=m[2];}continue;}
    if(line.startsWith("@sport")){const p=line.replace("@sport","").trim().split(" - ").map(x=>x.trim());const t=(p[2]||"").split("-");const rg=(p[3]||"").split("-");const sp={name:p[0],dows:(p[1]||"").split(",").map(x=>x.trim()),start:t[0],end:t[1],from:rg[0],to:rg[1],color:p[4]||"cyan"};if(s.terms.length)ensureTerm().sports.push(sp);else s.sports.push(sp);continue;}
    if(line.startsWith("@latearly")){line.replace("@latearly","").trim().split(/\s+/).forEach(p=>{const a=p.split("=");if(a[0]&&a[1])s.latearly[a[0]]=a[1];});continue;}
    if(line.startsWith("@day")){const m=line.match(/^@day\s+(\d+)\s*=\s*(.*)$/);if(m)s.days[m[1]]=m[2].trim().split(/\s+/).filter(Boolean).map(tok=>{const i=tok.indexOf(":");const p=tok.slice(0,i);const r=tok.slice(i+1).split("-");return{p,start:r[0],end:r[1]};});continue;}
    if(line.startsWith("@pref")){const m=line.match(/^@pref\s+(\w+)\s*=\s*(.*)$/);if(m)s.pref[m[1]]=m[2].trim();continue;}
    if(/^[A-H]\s*-/.test(line)){const p=line.split(" - ").map(x=>x.trim());const cl={name:p[1],num:p[2],sec:p[3],teacher:p[4],room:p[5],color:p[6]||"gray"};if(s.terms.length)ensureTerm().classes[p[0]]=cl;else s.classes[p[0]]=cl;continue;}
    if(idx===0){s.name=line;idx++;continue;}
    if(idx===1){s.form=line;const gm=line.match(/fresh/i)?9:line.match(/soph/i)?10:line.match(/jun/i)?11:line.match(/sen/i)?12:(line.match(/grade\s*(\d+)/i)?+RegExp.$1:null);s.grade=gm;idx++;continue;}
  }
  return s;
}

/* Pick the active term for a given date (MM.DD ranges, may wrap year-end). */
function termFor(stu,d){
  if(!stu||!stu.terms||!stu.terms.length) return stu;
  const mmdd=pad(d.getMonth()+1)+"."+pad(d.getDate());
  for(const t of stu.terms){
    if(!t.from||!t.to) return t;
    const wrap=t.from>t.to;
    const inRange = wrap ? (mmdd>=t.from||mmdd<=t.to) : (mmdd>=t.from&&mmdd<=t.to);
    if(inRange) return t;
  }
  return stu.terms[stu.terms.length-1];
}

/* ---- anchor-based cycle day map ---- */
function buildDayMap(parsed){
  const blocks=parsed.blocks, anchors=parsed.anchors, map={};
  const isNo=t=>t==="noclass"||t==="holiday";
  for(const b of blocks){
    let d=new Date(b.start);
    while(d<=b.end){
      const dow=d.getDay(), k=dkey(d);
      if(dow!==0&&dow!==6){
        if(isNo(b.type)) map[k]={cycle:null,name:b.name||"No Class",type:"noclass",school:false};
        else if(b.type==="immersive") map[k]={cycle:null,name:b.name||"Immersive",type:"immersive",school:true,nocycle:true};
        else if(b.type==="finals") map[k]={cycle:null,name:b.name||"Final Assessments",type:"finals",school:true,nocycle:true};
        else if(dow===3&&!b.name) map[k]={cycle:0,name:"Wednesday",type:"wednesday",school:true};
        else map[k]={cycle:0,name:b.name||"Normal Day",type:b.type||"normal",school:true};
      }
      d.setDate(d.getDate()+1);
    }
  }
  const sdays=Object.keys(map).filter(k=>map[k].school&&!map[k].nocycle).sort();
  const idxOf={}; sdays.forEach((k,i)=>idxOf[k]=i);
  const anc=anchors.slice().sort((a,b)=>a.date-b.date).filter(a=>dkey(a.date) in idxOf);
  for(const k of sdays){
    if(anc.length){
      let best=null;
      for(const a of anc){const ai=idxOf[dkey(a.date)];const dist=Math.abs(idxOf[k]-ai);if(!best||dist<best.dist)best={a,ai,dist};}
      const delta=idxOf[k]-best.ai;
      map[k].cycle=((best.a.cycle-1+delta)%8+8)%8+1;
    } else {
      map[k].cycle=(idxOf[k]%8)+1;
    }
  }
  return {map,hasAnchors:anc.length>0,firstDay:sdays[0],lastDay:sdays[sdays.length-1],
    firstImmersive:Object.keys(map).filter(k=>map[k].type==="immersive").sort()[0]||null};
}

/* ---- state ---- */
let DAYMAP={}, MAPINFO={}, STU=null, SCHOOL=null, IS12=true, weekStart=null, curYear=YEARS[0];
function mondayOf(d){const x=new Date(d);const dow=x.getDay();x.setDate(x.getDate()+(dow===0?-6:1-dow));x.setHours(0,0,0,0);return x;}

/* ---- rendering ---- */
const AX_START=8*60, AX_END=18*60, PX_PER_MIN=1.05, BODY_H=(AX_END-AX_START)*PX_PER_MIN;

function render(){
  const ghead=document.getElementById("ghead"), gbody=document.getElementById("gbody");
  ghead.innerHTML=""; gbody.innerHTML="";
  const corner=document.createElement("div");corner.className="corner";ghead.appendChild(corner);
  const todayKey=dkey(new Date());
  const days=[];
  for(let i=0;i<5;i++){
    const d=new Date(weekStart);d.setDate(d.getDate()+i);days.push(d);
    const k=dkey(d), info=DAYMAP[k];
    const cell=document.createElement("div");cell.className="dcell";
    if(k===todayKey)cell.classList.add("today");
    const cyc=info&&info.cycle?`Day ${info.cycle}`:"";
    const nm=info?info.name:"NA";
    cell.innerHTML=`<div class="dow">${DOW[d.getDay()]}</div><div class="dnum">${MON[d.getMonth()]} ${pad(d.getDate())}</div><div class="dcyc">${cyc}</div><div class="dname">${nm}</div>`;
    ghead.appendChild(cell);
  }
  gbody.style.height=BODY_H+"px";
  const axis=document.createElement("div");axis.className="axis";axis.style.height=BODY_H+"px";
  for(let h=8;h<=18;h++){const tick=document.createElement("div");tick.className="tick";tick.style.top=((h*60-AX_START)*PX_PER_MIN)+"px";tick.textContent=IS12?fmtTime(h*60,true):pad(h)+":00";axis.appendChild(tick);}
  gbody.appendChild(axis);

  const now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
  days.forEach(d=>{
    const k=dkey(d), info=DAYMAP[k];
    const col=document.createElement("div");col.className="col";col.style.height=BODY_H+"px";
    if(k===todayKey)col.classList.add("today");
    for(let h=8;h<=18;h++){const hl=document.createElement("div");hl.className="hline";hl.style.top=((h*60-AX_START)*PX_PER_MIN)+"px";col.appendChild(hl);}

    const DN3=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()];
    const T=STU?termFor(STU,d):null;
    if(info&&info.type==="finals"&&STU&&STU.finals){
      const mmdd=pad(d.getMonth()+1)+"."+pad(d.getDate());
      const blocks=STU.finals[mmdd]||[];
      blocks.forEach(b=>{
        const g=b.grades.toUpperCase();
        const mine = g==="ALL" || g.split(",").map(x=>x.trim()).includes(String(STU.grade));
        if(!mine)return;
        addBlock(col,k,todayKey,nowMin,{color:"#ff9ad2",start:toMin(b.start),end:toMin(b.end),name:b.label,per:"Final Assessment"});
      });
    } else if(info&&info.type==="immersive"&&T&&T.imm){
      const isFirst=(MAPINFO.firstImmersive===k);
      (STU.immBlocks||[]).forEach(b=>{
        const sess=/Session|Afternoon|Morning/.test(b.label);
        let label=b.label, show=true;
        if(/Community/i.test(b.label)&&STU.immComm){
          if(isFirst) label=STU.immComm.first||"Assembly";
          else if(DN3==="Wed") label=STU.immComm.Wed||"Advisory";
          else label=STU.immComm.default||"Community Time";
        }
        if(show) addBlock(col,k,todayKey,nowMin,{fixed:!sess,color:COLOR_MAP[T.imm.color]||"#9aa6ff",start:toMin(b.start),end:toMin(b.end),name:sess?T.imm.name:label,num:sess?T.imm.num:"",per:sess?b.label:"",teach:sess?`${T.imm.teacher} \u00b7 ${T.imm.room}`:""});
      });
    } else if(info&&info.school&&info.cycle&&T){
      (STU.days[String(info.cycle)]||[]).forEach(item=>{
        const cls=(T.classes||{})[item.p];if(!cls||cls.name==="Unscheduled")return;
        let st=item.start,en=item.end;
        if(info.type==="wednesday"&&STU.wed&&STU.wed[item.start]){st=STU.wed[item.start].start;en=STU.wed[item.start].end;}
        addBlock(col,k,todayKey,nowMin,{
          color:COLOR_MAP[cls.color]||cls.color||"#888",
          start:toMin(st),end:toMin(en),
          name:cls.name,num:cls.num,sec:cls.sec,
          per:`${item.p}${STU.latearly[item.p]?(" - "+STU.latearly[item.p]):""}`,
          teach:cls.teacher?`${cls.teacher}${cls.room?(" · "+cls.room):""}`:""
        });
      });
      if(info.type!=="wednesday"&&STU.comm&&STU.comm.time){
        const label=STU.comm[DN3];
        if(label) addBlock(col,k,todayKey,nowMin,{fixed:true,start:toMin(STU.comm.time.start),end:toMin(STU.comm.time.end),name:label,teach:"Rauh"});
      }
    } else if(info&&!info.school){
      const blk=document.createElement("div");blk.className="block dayfull";blk.style.setProperty("--blk","#262d3b");blk.style.color="#cfd6e2";blk.style.top="0";blk.style.height=BODY_H+"px";blk.style.display="grid";blk.style.placeItems="center";blk.style.borderStyle="dashed";blk.innerHTML=`<div class="bname" style="opacity:.85">${info.name}</div>`;col.appendChild(blk);
    }
    // sports (term-specific)
    if(info&&info.school&&T&&T.sports){
      const mmdd=pad(d.getMonth()+1)+"."+pad(d.getDate());
      T.sports.forEach(sp=>{
        if(!sp.dows.includes(DN3))return;
        if(sp.from&&sp.to&&!(mmdd>=sp.from&&mmdd<=sp.to))return;
        addBlock(col,k,todayKey,nowMin,{color:COLOR_MAP[sp.color]||"#79f0ff",start:toMin(sp.start),end:toMin(sp.end),name:sp.name,per:"Athletics"});
      });
    }
    // dismissal line: 3:00 normal/immersive, 3:25 Wednesday
    if(info&&info.school&&STU&&STU.dismiss){
      const dt=STU.dismiss[info.type==="wednesday"?"wednesday":(info.type==="immersive"?"immersive":"normal")];
      if(dt){const dis=toMin(dt);const dl=document.createElement("div");dl.style.cssText=`position:absolute;left:0;right:0;top:${(dis-AX_START)*PX_PER_MIN}px;border-top:2px solid rgba(255,210,63,.5);z-index:4`;col.appendChild(dl);}
    }
    if(k===todayKey&&nowMin>=AX_START&&nowMin<=AX_END){const bar=document.createElement("div");bar.className="nowbar";bar.style.top=((nowMin-AX_START)*PX_PER_MIN)+"px";col.appendChild(bar);}
    gbody.appendChild(col);
  });

  const wkEnd=new Date(weekStart);wkEnd.setDate(wkEnd.getDate()+4);
  document.getElementById("wkLabel").textContent=`${MON[weekStart.getMonth()]} ${pad(weekStart.getDate())} \u2013 ${MON[wkEnd.getMonth()]} ${pad(wkEnd.getDate())}, ${wkEnd.getFullYear()}`;
  renderLegend();
}

function addBlock(col,k,todayKey,nowMin,o){
  const top=(o.start-AX_START)*PX_PER_MIN, dur=(o.end-o.start)*PX_PER_MIN;
  const blk=document.createElement("div");blk.className="block"+(o.fixed?" fixed":"");
  if(!o.fixed)blk.style.setProperty("--blk",o.color);
  blk.style.top=top+"px";
  blk.style.height=Math.max(dur,22)+"px"; // true duration, touches dismissal line
  const tline=`${fmtTime(o.start,IS12)} \u2013 ${fmtTime(o.end,IS12)}`;
  // build ordered lines, first 3 always visible, rest in .bextra (fade-in on hover)
  const lines=[`<div class="bname">${o.name}</div>`];
  if(o.num)lines.push(`<div class="bnum">${o.num}${o.sec?(" \u00b7 "+o.sec):""}</div>`);
  if(o.per)lines.push(`<div class="bper">${o.per}</div>`);
  if(o.teach)lines.push(`<div class="bteach">${o.teach}</div>`);
  lines.push(`<div class="btime">${tline}</div>`);
  const nHead=o.fixed?1:3;
  const head=lines.slice(0,nHead).join(""), extra=lines.slice(nHead).join("");
  blk.innerHTML=head+(extra?`<div class="bextra">${extra}</div>`:"");
  if(k===todayKey&&nowMin>=o.start&&nowMin<o.end)blk.classList.add("now");
  col.appendChild(blk);
}

function renderLegend(){
  const el=document.getElementById("legend");if(!STU){el.innerHTML="";return;}
  el.innerHTML="";
  const T=weekStart?termFor(STU,weekStart):(STU.terms&&STU.terms[0])||STU;
  const cls=(T&&T.classes)||STU.classes||{};
  Object.entries(cls).forEach(([p,c])=>{
    if(c.name==="Unscheduled")return;
    const col=COLOR_MAP[c.color]||c.color||"#888";
    const d=document.createElement("div");d.className="li";
    d.innerHTML=`<span class="sw" style="background:${col}"></span>${p} \u00b7 ${c.name}`;el.appendChild(d);
  });
}

function tickClock(){const d=new Date();document.getElementById("cDate").textContent=`${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;document.getElementById("cTime").textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;}

/* ---- loading ---- */
async function tryFetch(path,fallback){try{const r=await fetch(path,{cache:"no-store"});if(r.ok){const t=await r.text();if(t&&t.length>5)return{text:t,live:true};}}catch(e){}return{text:fallback,live:false};}

async function loadYear(y){
  curYear=y;
  const res=await tryFetch(y.path, EMBED[y.id]||"");
  const built=buildDayMap(parseCalendar(res.text,y.startYear));
  DAYMAP=built.map; MAPINFO=built;
  let msg = res.live? "" : "Embedded data (serve via a local server to load live .txt files). ";
  if(!built.hasAnchors) msg += "No cycle anchors for this year yet \u2014 Day numbers start at 1 on the first day and may be phase-shifted until you add an @anchor line.";
  document.getElementById("status").textContent=msg;
}

function yearForDate(d){
  // school year runs Aug 1 -> Jul 31
  const m=d.getMonth(), y=d.getFullYear();
  const startYear=(m>=7)?y:y-1; // Aug(7)+ belongs to that year's start
  return YEARS.find(Y=>Y.startYear===startYear)||null;
}
async function ensureYearFor(d){
  const y=yearForDate(d);
  if(y&&(!curYear||y.id!==curYear.id)){await loadYear(y);document.getElementById("yearSel").value=y.id;}
  else if(!y){document.getElementById("status").textContent="No calendar loaded for "+(d.getFullYear())+" \u2014 add one to /calendar.";}
}

async function loadStudent(stu){
  if(!SCHOOL){const sr=await tryFetch("schedule.txt", EMBED.school);SCHOOL=parseStudent(sr.text);}
  if(!stu){STU=null;render();return;}
  const res=await tryFetch(stu.path, EMBED.student);
  STU=parseStudent(res.text);
  STU.fixed=SCHOOL.fixed||[];
  STU.immBlocks=SCHOOL.immBlocks||[];
  STU.dismiss=SCHOOL.dismiss||{normal:"15:00",immersive:"15:00",wednesday:"15:25"};
  STU.wed=SCHOOL.wed||{};
  STU.days=SCHOOL.days||{};          // rotation is school-wide
  STU.latearly=SCHOOL.latearly||{};  // La/Ea is school-wide
  STU.comm=SCHOOL.comm||null;
  STU.immComm=SCHOOL.immComm||null;
  STU.finals=SCHOOL.finals||{};
  if(STU.pref.background)document.documentElement.style.setProperty("--bg",STU.pref.background);
  if(STU.pref.highlight_class)document.documentElement.style.setProperty("--accent",STU.pref.highlight_class);
  if(STU.pref.highlight_day)document.documentElement.style.setProperty("--today",STU.pref.highlight_day);
  if(STU.pref.time_format){IS12=STU.pref.time_format!=="24h";syncFmtSeg();}
}

function syncFmtSeg(){document.querySelectorAll("#fmtSeg button").forEach(b=>b.classList.toggle("on",(b.dataset.f==="12h")===IS12));}

function pickDefaultWeek(){
  const todayKey=dkey(new Date());
  if(DAYMAP[todayKey]) weekStart=mondayOf(new Date());
  else if(MAPINFO.firstDay){const a=MAPINFO.firstDay.split("-").map(Number);weekStart=mondayOf(new Date(a[0],a[1]-1,a[2]));}
  else weekStart=mondayOf(new Date());
}

async function init(){
  const yearSel=document.getElementById("yearSel");
  YEARS.forEach(y=>{const o=document.createElement("option");o.value=y.id;o.textContent=y.label;yearSel.appendChild(o);});

  // load student manifest
  const mres=await tryFetch("students/index.txt", STUDENTS_EMBED);
  STUDENTS=parseStudentIndex(mres.text);

  // preload school defs
  if(!SCHOOL){const sr=await tryFetch("schedule.txt", EMBED.school);SCHOOL=parseStudent(sr.text);}

  // year = the one containing today, else first
  const today=new Date();
  const def=yearForDate(today)||YEARS[0];
  yearSel.value=def.id;
  await loadYear(def);
  STU=null; // no student until searched
  pickDefaultWeek();
  render();
  tickClock();setInterval(tickClock,1000);
  setInterval(render,60000);
}

/* ---- events ---- */
async function goWeek(deltaDays){
  weekStart.setDate(weekStart.getDate()+deltaDays);weekStart=new Date(weekStart);
  await ensureYearFor(weekStart);
  render();
}

document.getElementById("nextWk").onclick=()=>goWeek(7);

document.getElementById("todayBtn").onclick=async()=>{const y=yearForDate(new Date());if(y){await loadYear(y);document.getElementById("yearSel").value=y.id;}pickDefaultWeek();render();};
document.querySelectorAll("#fmtSeg button").forEach(b=>b.onclick=()=>{IS12=(b.dataset.f==="12h");syncFmtSeg();render();});

const sIn=document.getElementById("stuSearch"), sRes=document.getElementById("stuResults");

  sRes.style.display="block";

sIn.addEventListener("focus",e=>renderResults(e.target.value));

const dlg=document.getElementById("dateDlg");
function fillDlg(){const Y=document.getElementById("dlgY"),M=document.getElementById("dlgM"),D=document.getElementById("dlgD");Y.innerHTML="";const ys=new Set();YEARS.forEach(y=>{ys.add(y.startYear);ys.add(y.startYear+1);});[...ys].sort().forEach(y=>{const o=document.createElement("option");o.value=y;o.textContent=y;Y.appendChild(o);});M.innerHTML="";MON.forEach((m,i)=>{const o=document.createElement("option");o.value=i;o.textContent=m;M.appendChild(o);});const d=new Date(weekStart);Y.value=d.getFullYear();M.value=d.getMonth();fillDays();D.value=d.getDate();}
function fillDays(){const Y=+document.getElementById("dlgY").value,M=+document.getElementById("dlgM").value,D=document.getElementById("dlgD");const n=new Date(Y,M+1,0).getDate();const cur=D.value;D.innerHTML="";for(let i=1;i<=n;i++){const o=document.createElement("option");o.value=i;o.textContent=i;D.appendChild(o);}if(cur&&cur<=n)D.value=cur;}
document.getElementById("pickBtn").onclick=()=>{fillDlg();dlg.showModal();};
document.getElementById("dlgM").onchange=fillDays;document.getElementById("dlgY").onchange=fillDays;
document.getElementById("dlgCancel").onclick=()=>dlg.close();
document.getElementById("dlgGo").onclick=async()=>{const Y=+document.getElementById("dlgY").value,M=+document.getElementById("dlgM").value,D=+document.getElementById("dlgD").value;weekStart=mondayOf(new Date(Y,M,D));dlg.close();await ensureYearFor(weekStart);render();};

init();
</script>
</body>
</html>
